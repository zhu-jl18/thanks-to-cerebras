name: agent-address-api-key-review

on:
  push:
    branches: [agent/api-key-atomic-unique-claim]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/api-key-atomic-unique-claim
          fetch-depth: 0
      - name: Setup Deno
        uses: denoland/setup-deno@v2.0.4
        with:
          deno-version: 2.9.0
      - name: Apply verified review fixes
        run: deno run --allow-read --allow-write scripts/agent-address-api-key-review.ts
      - name: Format TypeScript
        run: deno fmt main.ts src scripts/*.ts
      - name: Type-check final sources
        run: deno task check
      - name: Run focused regressions
        run: >-
          deno test --allow-net --allow-env --allow-read --allow-write
          src/__tests__/api-key-store_test.ts
          src/__tests__/api-key-kv_test.ts
          src/__tests__/api-key-cache-refresh_test.ts
      - name: Remove one-shot fixup
        run: |
          rm -f scripts/agent-address-api-key-review.ts
          rm -f .github/workflows/agent-address-api-key-review.yml
      - name: Verify patch hygiene
        run: git diff --check
      - name: Commit final tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(api-keys): address verified review findings"
          git push origin HEAD:agent/api-key-atomic-unique-claim
