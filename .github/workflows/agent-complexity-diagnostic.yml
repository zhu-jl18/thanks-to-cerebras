name: agent-complexity-diagnostic

on:
  push:
    branches: [agent/api-key-atomic-unique-claim]

permissions:
  contents: write

jobs:
  complexity-diagnostic:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: agent/api-key-atomic-unique-claim
      - name: Setup Deno
        uses: denoland/setup-deno@v2.0.4
        with:
          deno-version: 2.9.0
      - name: Capture complexity output
        run: |
          set +e
          deno task complexity:check > complexity-output.txt 2>&1
          status=$?
          echo "$status" > complexity-status.txt
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add complexity-output.txt complexity-status.txt
          git commit -m "chore(ci): record complexity diagnostics"
          git push origin HEAD:agent/api-key-atomic-unique-claim
