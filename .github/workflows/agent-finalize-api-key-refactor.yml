name: agent-finalize-api-key-refactor

on:
  push:
    branches: [agent/api-key-atomic-unique-claim]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/api-key-atomic-unique-claim
          fetch-depth: 0
      - name: Setup Deno
        uses: denoland/setup-deno@v2.0.4
        with:
          deno-version: 2.9.0
      - name: Apply asserted codemod
        run: deno run --allow-read --allow-write scripts/agent-finalize-api-key-refactor.ts
      - name: Format TypeScript
        run: deno fmt main.ts src scripts/*.ts
      - name: Remove one-shot finalizer
        run: |
          git rm scripts/agent-finalize-api-key-refactor.ts
          git rm .github/workflows/agent-finalize-api-key-refactor.yml
      - name: Verify patch hygiene
        run: git diff --check
      - name: Commit finalized tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(api-keys): finalize refactor tree"
          git push origin HEAD:agent/api-key-atomic-unique-claim