name: agent-fix-api-key-store-tests

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: >-
      github.event.pull_request.head.ref == 'agent/api-key-atomic-unique-claim' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/api-key-atomic-unique-claim
          fetch-depth: 0
      - name: Setup Deno
        uses: denoland/setup-deno@v2.0.4
        with:
          deno-version: 2.9.0
      - name: Apply asserted test fixup
        run: deno run --allow-read --allow-write scripts/agent-fix-api-key-store-tests.ts
      - name: Format TypeScript
        run: deno fmt main.ts src scripts/*.ts
      - name: Remove one-shot fixup
        run: |
          rm -f scripts/agent-fix-api-key-store-tests.ts
          rm -f .github/workflows/agent-fix-api-key-store-tests.yml
      - name: Verify patch hygiene
        run: git diff --check
      - name: Commit fixed tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(api-keys): align cache eviction with store invariant"
          git push origin HEAD:agent/api-key-atomic-unique-claim