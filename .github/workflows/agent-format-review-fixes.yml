name: agent-format-review-fixes

on:
  push:
    branches: [agent/api-key-atomic-unique-claim]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/api-key-atomic-unique-claim
          fetch-depth: 0
      - name: Setup Deno
        uses: denoland/setup-deno@v2.0.4
        with:
          deno-version: 2.9.0
      - name: Format sources
        run: deno fmt main.ts src scripts/*.ts
      - name: Remove one-shot formatter
        run: rm -f .github/workflows/agent-format-review-fixes.yml
      - name: Verify patch hygiene
        run: git diff --check
      - name: Commit formatted tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(api-keys): format review fixes"
          git push origin HEAD:agent/api-key-atomic-unique-claim
